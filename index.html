<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tick-Tock">
<meta name="theme-color" content="#ffd6ea">
<title>Tick-Tock Boutique</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff5c9a; --pink2: #ffd6ea; --purple: #8a5cf6; --ink: #3b2450; --soft: #fff7fb;
    --hour: #ff4f9a; --minute: #3d7bff; --good: #2fbf71; --bad: #ff7a59;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    font-family: "Fredoka", "Avenir Next", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(160deg, #ffe3f1 0%, #f2e6ff 55%, #dff3ff 100%);
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex: none; }
  .brand { font-weight: 700; font-size: 22px; color: var(--pink); letter-spacing: .5px; flex: 1; white-space: nowrap; }
  .brand small { color: var(--purple); font-weight: 500; font-size: 15px; margin-left: 6px; }
  .stars { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 20px; box-shadow: 0 3px 0 #f0c6dd; }
  .tabs { display: flex; gap: 6px; }
  .tab { padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.6); font-weight: 600; font-size: 16px; }
  .tab.on { background: var(--pink); color: #fff; box-shadow: 0 3px 0 #d63d7a; }
  .icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.7); font-size: 18px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 38%) 1fr; gap: 14px; padding: 0 16px 14px; }
  body.portrait main { grid-template-columns: 1fr; grid-template-rows: 36% 1fr; }
  #stage { position: relative; background: #fff; border-radius: 24px; box-shadow: 0 6px 0 #f0c6dd, 0 14px 30px rgba(138,92,246,.15); overflow: hidden; display: flex; flex-direction: column; }
  #doll { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
  #doll svg { height: 100%; max-width: 100%; }
  #doll.happy svg { animation: hop .8s ease; }
  #doll.sad svg { animation: tilt .8s ease; }
  @keyframes hop { 0%,100% { transform: translateY(0) } 30% { transform: translateY(-6%) rotate(-3deg) } 60% { transform: translateY(0) rotate(3deg) } }
  @keyframes tilt { 0%,100% { transform: rotate(0) } 40% { transform: rotate(-4deg) } }
  #levelBar { padding: 8px 14px 12px; font-size: 15px; }
  .bar { height: 12px; border-radius: 6px; background: #f3e3ee; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8fc0, var(--purple)); border-radius: 6px; transition: width .5s; }

  #panel { position: relative; background: rgba(255,255,255,.85); border-radius: 24px; box-shadow: 0 6px 0 #e7d6f7; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }
  .q { font-size: 26px; font-weight: 600; text-align: center; margin: 4px 0 10px; }
  .q b { color: var(--pink); }
  .clockwrap { display: flex; justify-content: center; }
  .clock { width: min(100%, 360px); aspect-ratio: 1; touch-action: none; }
  .clock.small { width: 100%; }
  .opts { display: grid; gap: 10px; margin-top: 12px; }
  .opt { background: #fff; border: 3px solid #f0d2e6; border-radius: 18px; padding: 12px; font-size: 22px; font-weight: 600; box-shadow: 0 4px 0 #f0d2e6; }
  .opt small { display: block; color: #9a86ad; font-size: 15px; font-weight: 500; }
  .opt.good { border-color: var(--good); background: #e8fbef; box-shadow: 0 4px 0 #a6e8c2; }
  .opt.bad { border-color: var(--bad); background: #fff0eb; box-shadow: 0 4px 0 #ffc7b6; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .three button { background: #fff; border: 3px solid #f0d2e6; border-radius: 18px; padding: 6px; box-shadow: 0 4px 0 #f0d2e6; }
  .three button.good { border-color: var(--good); background: #e8fbef; }
  .three button.bad { border-color: var(--bad); background: #fff0eb; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .big { background: linear-gradient(180deg, #ff86b7, var(--pink)); color: #fff; font-weight: 700; font-size: 22px; padding: 12px 28px; border-radius: 999px; box-shadow: 0 5px 0 #d63d7a; }
  .big.purple { background: linear-gradient(180deg, #a989ff, var(--purple)); box-shadow: 0 5px 0 #6a3fd6; }
  .soft { background: #fff; font-weight: 600; font-size: 17px; padding: 9px 18px; border-radius: 999px; box-shadow: 0 3px 0 #e7d6f7; }
  .big:active, .soft:active, .opt:active { transform: translateY(3px); box-shadow: none; }
  .explain { margin-top: 12px; background: #fff4e0; border-radius: 16px; padding: 12px 14px; font-size: 18px; line-height: 1.4; }
  .explain.good { background: #e8fbef; }
  .explain b { color: var(--hour); } .explain i { color: var(--minute); font-style: normal; font-weight: 600; }
  .digital { text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 2px; color: var(--purple); margin-top: 6px; }

  .levels { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .lv { padding: 6px 12px; border-radius: 999px; background: #f3e9ff; font-size: 14px; font-weight: 600; color: #7a5aa6; }
  .lv.on { background: var(--purple); color: #fff; }
  .lv.locked { opacity: .45; }

  /* wardrobe */
  .cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; flex: none; }
  .cat { flex: none; padding: 8px 12px; border-radius: 14px; background: #fff; font-weight: 600; font-size: 15px; box-shadow: 0 3px 0 #f0d2e6; }
  .cat.on { background: var(--pink); color: #fff; box-shadow: 0 3px 0 #d63d7a; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; margin-top: 6px; }
  .item { position: relative; background: #fff; border-radius: 18px; padding: 6px 6px 8px; border: 3px solid transparent; box-shadow: 0 4px 0 #f0d2e6; text-align: center; }
  .item svg { width: 100%; height: 92px; display: block; }
  .item .nm { font-size: 14px; font-weight: 600; line-height: 1.1; }
  .item.on { border-color: var(--pink); }
  .item.locked svg { filter: grayscale(1) opacity(.45); }
  .item .price { position: absolute; top: 6px; right: 6px; background: #ffe14d; border-radius: 999px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
  .item.confirm { border-color: #ffb100; animation: wiggle .4s; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) } 30% { transform: rotate(-3deg) } 60% { transform: rotate(3deg) } }

  /* overlays */
  .overlay { position: fixed; inset: 0; z-index: 30; background: rgba(59,36,80,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .card { background: #fff; border-radius: 28px; padding: 22px; width: min(520px, 100%); max-height: 100%; overflow-y: auto; text-align: center; box-shadow: 0 10px 0 #f0c6dd; }
  .card h2 { color: var(--pink); font-size: 28px; margin-bottom: 6px; }
  .card p { font-size: 19px; line-height: 1.45; margin: 8px 0; }
  .card .clock { width: min(70vw, 260px); }
  .card input { font: inherit; font-size: 24px; text-align: center; padding: 8px 14px; border-radius: 14px; border: 3px solid #f0d2e6; width: 80%; user-select: text; -webkit-user-select: text; }
  .legend { display: flex; justify-content: center; gap: 16px; font-weight: 600; margin: 6px 0; }
  .legend span::before { content: ""; display: inline-block; width: 22px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; background: var(--c); }

  #toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 40px); opacity: 0; transition: .3s; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 18px; z-index: 40; pointer-events: none; max-width: 92vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 50; pointer-events: none; border-radius: 3px; }
  .flystar { position: fixed; z-index: 50; font-size: 34px; pointer-events: none; transition: all .8s cubic-bezier(.5,-0.3,.6,1); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Tick-Tock Boutique <small id="who"></small></div>
    <div class="tabs">
      <button class="tab on" data-mode="clock">⏰ Clocks</button>
      <button class="tab" data-mode="wardrobe">👗 Wardrobe</button>
    </div>
    <div class="stars" id="stars">⭐ 0</div>
    <button class="icon" id="musicBtn" title="Music">🎵</button>
    <button class="icon" id="soundBtn" title="Sound">🔊</button>
  </header>
  <main>
    <section id="stage">
      <div id="doll"></div>
      <div id="levelBar"></div>
    </section>
    <section id="panel"></section>
  </main>
</div>

<div class="overlay" id="welcome"><div class="card">
  <h2>Tick-Tock Boutique</h2>
  <p>Read the clocks to earn ⭐ stars.<br>Spend your stars on dresses, crowns, make-up and more!</p>
  <p><input id="nameIn" maxlength="14" placeholder="Your name"></p>
  <div class="row"><button class="big" id="goBtn">Let's play!</button></div>
</div></div>

<div class="overlay" id="lessonOv"><div class="card" id="lessonCard"></div></div>
<div id="toast"></div>

<script type="module">
import { ITEMS, BY_ID, CATS, dollSVG, thumbSVG } from './doll.js';

const $ = s => document.querySelector(s);
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- saved progress (this iPad only) ----------
const KEY = 'ttb:v1';
const FREE = ITEMS.filter(i => i.cost === 0).map(i => i.id);
const DEFAULT = {
  name: new URLSearchParams(location.search).get('name') || 'Margot',
  stars: 3, owned: FREE, music: true, unlocked: 1, level: 1, right: {}, seen: {}, sound: true, streak: 0, total: 0,
  look: { bg: 'bedroom', skin: 'sk1', eyes: 'ey-brown', hair: 'long', hairColor: 'hc-brown', top: 'tee', bottom: 'shorts', dress: null, shoes: 'trainers', hat: null, wings: null, acc: null, makeup: [] },
};
let S = DEFAULT;
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) S = { ...DEFAULT, ...v, look: { ...DEFAULT.look, ...(v.look || {}) } }; } catch (e) {}
S.owned = [...new Set([...S.owned, ...FREE])];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- the five levels ----------
const LEVELS = [
  { name: "O'clock", minutes: [0], snap: 5, need: 6,
    text: ["Every clock has two hands.", "The <b>short pink hand</b> is the <b>hour</b> hand. The <i>long blue hand</i> is the <i>minute</i> hand.",
      "When the long hand points straight up at <i>12</i>, it's something <b>o'clock</b>. Look where the short hand points: that's the hour!"],
    demo: [[2, 0], [3, 0]], hold: [3, 0] },
  { name: 'Half past', minutes: [30, 30, 0], snap: 5, need: 6,
    text: ["When the long hand has gone <i>halfway round</i>, down to the <i>6</i>, it's <b>half past</b>.",
      "The short hand is now halfway between two numbers. Say the number it has just gone past.", "This clock says <b>half past 3</b>."],
    demo: [[3, 0], [3, 30]], hold: [3, 30] },
  { name: 'Quarter past & to', minutes: [15, 45, 15, 45, 30], snap: 5, need: 8,
    text: ["A quarter of the way round, at the <i>3</i>, is <b>quarter past</b>.",
      "Three quarters of the way round, at the <i>9</i>, is <b>quarter to</b> the next hour.",
      "At quarter to 4 the short hand is <b>nearly at 4</b>, so we say quarter to 4."],
    demo: [[3, 0], [3, 45]], hold: [3, 45] },
  { name: 'Five minutes', minutes: [5, 10, 20, 25, 35, 40, 50, 55, 15, 45], snap: 5, need: 10, hint: true,
    text: ["Each number is <i>5 minutes</i> for the long hand. Count in fives: 5, 10, 15, 20...",
      "On the <b>right</b> side of the clock we say <b>past</b>: twenty past 3.",
      "On the <b>left</b> side we count how many minutes <b>to</b> the next hour: ten to 4."],
    demo: [[3, 0], [3, 50]], hold: [3, 50] },
  { name: 'Every minute', minutes: Array.from({ length: 60 }, (_, i) => i), snap: 1, need: 10, hint: true,
    text: ["The little marks between the numbers are <i>single minutes</i>.",
      "Count in fives to the number just before the long hand, then add the little marks.",
      "You can say it like a digital clock: <b>3:27</b>."],
    demo: [[3, 20], [3, 27]], hold: [3, 27] },
];

// ---------- telling the time in words ----------
const WORDS = { 5: 'five', 10: 'ten', 15: 'quarter', 20: 'twenty', 25: 'twenty-five', 30: 'half' };
const nextH = h => (h % 12) + 1;
function phrase(h, m) {
  if (m === 0) return `${h} o'clock`;
  if (m <= 30) return `${WORDS[m] || m + (m === 1 ? ' minute' : ' minutes')} past ${h}`;
  const t = 60 - m;
  return `${WORDS[t] || t + (t === 1 ? ' minute' : ' minutes')} to ${nextH(h)}`;
}
const digital = (h, m) => `${h}:${String(m).padStart(2, '0')}`;
function explain(h, m) {
  const nh = nextH(h);
  if (m === 0) return `The <i>long blue hand</i> points straight up at <i>12</i>, so it's <b>o'clock</b>. The <b>short pink hand</b> points at <b>${h}</b>. So it's <b>${h} o'clock</b>.`;
  if (m === 30) return `The <i>long hand</i> points down at <i>6</i>: halfway round, so it's <b>half past</b>. The <b>short hand</b> has just gone past <b>${h}</b>. So it's <b>half past ${h}</b>.`;
  if (m === 15) return `The <i>long hand</i> points at <i>3</i>: a quarter of the way round, so it's <b>quarter past</b>. The <b>short hand</b> is just past <b>${h}</b>. So it's <b>quarter past ${h}</b>.`;
  if (m === 45) return `The <i>long hand</i> points at <i>9</i>: that's <b>quarter to</b> the next hour. The <b>short hand</b> is nearly at <b>${nh}</b>. So it's <b>quarter to ${nh}</b>.`;
  if (m % 5 === 0) return m < 30
    ? `The <i>long hand</i> points at <i>${m / 5}</i>. Count in fives: that's <i>${m} minutes</i>. It's on the right side, so it's <b>${phrase(h, m)}</b>.`
    : `The <i>long hand</i> points at <i>${m / 5}</i>, on the left side. Count the fives up to 12: <i>${60 - m} minutes</i> to go. The short hand is nearly at <b>${nh}</b>, so it's <b>${phrase(h, m)}</b>.`;
  return `Count in fives to the number before the <i>long hand</i>, then add the little marks: <i>${m} minutes</i>. The <b>short hand</b> is between ${h} and ${nh}, so it's <b>${digital(h, m)}</b>.`;
}

// ---------- the clock face ----------
function clockSVG(h, m, { hint = false, cls = 'clock', id = '' } = {}) {
  const ma = m * 6, ha = ((h % 12) + m / 60) * 30;
  const pt = (a, r) => [Math.sin(a * Math.PI / 180) * r, -Math.cos(a * Math.PI / 180) * r];
  let s = `<svg ${id ? `id="${id}"` : ''} class="${cls}" viewBox="-124 -124 248 248">`;
  if (hint) {
    s += `<path d="M0 0 L0 -100 A100 100 0 0 1 0 100 Z" fill="#dff8e8"/><path d="M0 0 L0 100 A100 100 0 0 1 0 -100 Z" fill="#fff0dc"/>`;
    s += `<text x="44" y="12" font-size="15" fill="#2fbf71" font-weight="700" text-anchor="middle">past</text><text x="-44" y="12" font-size="15" fill="#ff9a3d" font-weight="700" text-anchor="middle">to</text>`;
  }
  s += `<circle r="100" fill="${hint ? 'none' : '#fff'}" stroke="#ff8fc0" stroke-width="7"/>`;
  for (let i = 0; i < 60; i++) {
    const [x1, y1] = pt(i * 6, i % 5 ? 92 : 87), [x2, y2] = pt(i * 6, 97);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i % 5 ? '#c9b6da' : '#7a5aa6'}" stroke-width="${i % 5 ? 1.5 : 3}"/>`;
  }
  for (let n = 1; n <= 12; n++) { const [x, y] = pt(n * 30, 72); s += `<text x="${x}" y="${y + 7}" font-size="21" font-weight="700" fill="#3b2450" text-anchor="middle">${n}</text>`; }
  if (hint) for (let n = 0; n < 12; n++) { const [x, y] = pt(n * 30, 113); s += `<text x="${x}" y="${y + 5}" font-size="12" font-weight="700" fill="#3d7bff" text-anchor="middle">${n === 0 ? '00' : n * 5}</text>`; }
  const [hx, hy] = pt(ha, 50), [mx, my] = pt(ma, 80);
  s += `<line class="hh" x1="0" y1="0" x2="${hx}" y2="${hy}" stroke="#ff4f9a" stroke-width="11" stroke-linecap="round"/>`;
  s += `<line class="mh" x1="0" y1="0" x2="${mx}" y2="${my}" stroke="#3d7bff" stroke-width="6" stroke-linecap="round"/>`;
  s += `<circle r="8" fill="#3b2450"/><circle r="3" fill="#fff"/></svg>`;
  return s;
}

// ---------- sound and voice: all made in the browser, no files ----------
let AC = null, BUS = null, MUSIC = null;
function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    // a little sparkly echo on everything
    BUS = AC.createGain(); BUS.connect(AC.destination);
    const d = AC.createDelay(); d.delayTime.value = 0.17;
    const fb = AC.createGain(); fb.gain.value = 0.28;
    const wet = AC.createGain(); wet.gain.value = 0.22;
    BUS.connect(d); d.connect(fb).connect(d); d.connect(wet).connect(AC.destination);
    MUSIC = AC.createGain(); MUSIC.gain.value = 0.55; MUSIC.connect(BUS);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t0, dur, vol = 0.12, type = 'sine', { to = null, out = null, force = false } = {}) {
  const ac = audio(); if (!ac || (!S.sound && !force)) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
  const t = ac.currentTime + t0;
  o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(out || BUS); o.start(t); o.stop(t + dur + 0.05);
}
const bell = (f, t0, vol = 0.08, out) => { tone(f, t0, 1.1, vol, 'sine', { out }); tone(f * 2, t0, 0.6, vol * 0.35, 'sine', { out }); tone(f * 3.01, t0, 0.3, vol * 0.15, 'sine', { out }); };
const sfx = {
  good: () => { [1047, 1319, 1568, 2093].forEach((f, i) => bell(f, i * 0.07, 0.07)); },
  bad: () => { tone(520, 0, 0.55, 0.08, 'sine', { to: 330 }); tone(526, 0.02, 0.55, 0.05, 'triangle', { to: 336 }); },
  tick: () => tone(1800, 0, 0.03, 0.04, 'square'),
  pop: () => tone(420, 0, 0.09, 0.12, 'sine', { to: 1100 }),
  boing: () => { tone(260, 0, 0.18, 0.1, 'triangle', { to: 620 }); tone(620, 0.18, 0.22, 0.08, 'triangle', { to: 300 }); },
  ding: () => { bell(1568, 0, 0.09); bell(2093, 0.06, 0.07); },
  buy: () => { for (let i = 0; i < 14; i++) bell(800 + i * 110 + Math.random() * 60, i * 0.04, 0.045); },
  level: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => bell(f, i * 0.13, 0.08)),
};
// a gentle music-box tune, made up for this game, looping quietly in the background
const TUNE = [76, 79, 84, 79, 81, 79, 76, 72, 74, 76, 79, 76, 74, 72, 74, 0, 76, 79, 84, 86, 84, 81, 79, 76, 77, 76, 74, 72, 74, 72, 72, 0];
const BASS = [48, 43, 45, 43, 48, 41, 43, 48];
let musicT = 0, musicStep = 0, musicTimer = null;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function startMusic() {
  if (musicTimer || !S.music) return;
  const ac = audio(); if (!ac) return;
  musicT = ac.currentTime + 0.1;
  musicTimer = setInterval(() => {
    while (musicT < ac.currentTime + 0.6) {
      const n = TUNE[musicStep % TUNE.length];
      if (n) bell(midi(n), musicT - ac.currentTime, 0.035, MUSIC);
      if (musicStep % 4 === 0) tone(midi(BASS[(musicStep / 4) % BASS.length]), musicT - ac.currentTime, 1.2, 0.03, 'sine', { out: MUSIC, force: true });
      musicT += 0.34; musicStep++;
    }
  }, 150);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }
// Recorded voice clips (voice/<key>.mp3, listed in voice/manifest.json) are used
// when they exist; anything not recorded falls back to the iPad's own voice.
let CLIPS = new Set(); const BUF = new Map();
fetch('voice/manifest.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(k => { CLIPS = new Set(k); }).catch(() => {});
async function clip(key) {
  if (BUF.has(key)) return BUF.get(key);
  const ac = audio(); if (!ac) return null;
  const p = fetch(`voice/${key}.mp3`).then(r => r.arrayBuffer()).then(b => new Promise((res, rej) => ac.decodeAudioData(b, res, rej))).catch(() => null);
  BUF.set(key, p); return p;
}
let voiceGen = 0;
async function voice(keys, text) {
  if (!S.sound) return;
  if (!keys.length || !keys.every(k => CLIPS.has(k))) return say(text);
  const id = ++voiceGen; try { speechSynthesis.cancel(); } catch (e) {}
  const bufs = await Promise.all(keys.map(clip));
  if (id !== voiceGen || bufs.some(b => !b)) return id === voiceGen ? say(text) : null;
  if (MUSIC) MUSIC.gain.setTargetAtTime(0.2, AC.currentTime, 0.1);
  let t = AC.currentTime + 0.05;
  for (const b of bufs) { const src = AC.createBufferSource(); src.buffer = b; src.connect(AC.destination); src.start(t); t += b.duration + 0.08; }
  setTimeout(() => { if (MUSIC && id === voiceGen) MUSIC.gain.setTargetAtTime(0.55, AC.currentTime, 0.4); }, (t - AC.currentTime) * 1000);
}
const timeKey = (h, m) => (m % 5 === 0 ? `t-${h}-${m}` : null);
const CHEERS = ['Brilliant!', 'Yes!', 'Well done!', 'Super!', 'Amazing!', 'You got it!'];
// every line the character says, for the recording script
window.__ttbLines = () => {
  const L = {};
  for (let h = 1; h <= 12; h++) for (let m = 0; m < 60; m += 5) L[`t-${h}-${m}`] = phrase(h, m) + '.';
  CHEERS.forEach((c, i) => { L[`cheer-${i}`] = c; });
  L.nq = 'Not quite! Look at the hands.';
  L.bonus = 'Five in a row! A bonus star!';
  L.level = 'Hooray! A brand new level!';
  L.need = "You need a few more stars. Let's read some clocks!";
  L.hello = `Hello ${S.name}! Let's learn the clock.`;
  LEVELS.forEach((l, i) => { L[`lesson-${i + 1}`] = l.text.join(' ').replace(/<[^>]+>/g, ''); });
  ITEMS.filter(it => it.cost > 0).forEach(it => { L[`got-${it.id}`] = `You got the ${it.name.toLowerCase()}!`; });
  return L;
};

function say(text) {
  if (!S.sound || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, ''));
    const vs = speechSynthesis.getVoices();
    const v = ['Kate', 'Serena', 'Martha', 'Stephanie', 'Google UK English Female', 'Fiona', 'Moira'].map(n => vs.find(x => x.name.includes(n))).find(Boolean)
      || vs.find(x => /en[-_]GB/i.test(x.lang));
    if (v) u.voice = v; u.lang = 'en-GB'; u.rate = 0.95; u.pitch = 1.25;
    if (MUSIC) MUSIC.gain.setTargetAtTime(0.2, AC.currentTime, 0.1);       // music ducks while she talks
    u.onend = () => { if (MUSIC) MUSIC.gain.setTargetAtTime(0.55, AC.currentTime, 0.4); };
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- confetti and stars ----------
function confetti(n = 40) {
  const cols = ['#ff5c9a', '#8a5cf6', '#ffd23d', '#3d7bff', '#2fbf71'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = pick(cols);
    document.body.appendChild(c);
    c.animate([{ transform: `translateY(0) rotate(0)` }, { transform: `translateY(${innerHeight + 40}px) rotate(${rand(720)}deg)` }],
      { duration: 1400 + rand(1200), easing: 'cubic-bezier(.3,.6,.6,1)', delay: rand(300) }).onfinish = () => c.remove();
  }
}
function flyStar(from) {
  const s = document.createElement('div'); s.className = 'flystar'; s.textContent = '⭐';
  const r = from.getBoundingClientRect(), t = $('#stars').getBoundingClientRect();
  s.style.left = r.left + r.width / 2 + 'px'; s.style.top = r.top + 'px';
  document.body.appendChild(s);
  requestAnimationFrame(() => { s.style.left = t.left + 10 + 'px'; s.style.top = t.top + 'px'; s.style.transform = 'scale(.6)'; });
  setTimeout(() => { s.remove(); sfx.ding(); $('#stars').animate([{ transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 300 }); }, 820);
}
let toastT;
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

// ---------- the doll ----------
function renderDoll(mood) {
  $('#doll').innerHTML = dollSVG(S.look);
  if (mood) { const d = $('#doll'); d.classList.remove('happy', 'sad'); void d.offsetWidth; d.classList.add(mood); if (mood === 'happy') setTimeout(sfx.boing, 120); }
}
function renderTop() {
  $('#stars').textContent = `⭐ ${S.stars}`;
  $('#who').textContent = S.name ? `for ${S.name}` : '';
  $('#soundBtn').textContent = S.sound ? '🔊' : '🔈';
  $('#musicBtn').style.opacity = S.music ? 1 : 0.4;
  const L = LEVELS[S.level - 1], got = S.right[S.level] || 0;
  $('#levelBar').innerHTML = `<b>Level ${S.level}: ${L.name}</b>${S.level < 5 && S.level === S.unlocked ? `<div class="bar"><i style="width:${Math.min(100, got / L.need * 100)}%"></i></div>` : ''}`;
}

// ---------- questions ----------
let mode = 'clock', Q = null, answered = false, hintOn = false;
function newQuestion() {
  const L = LEVELS[S.level - 1];
  let lv = S.level;
  if (lv > 1 && Math.random() < 0.25) lv = 1 + rand(lv - 1);    // a few easier ones to keep them fresh
  const m = pick(LEVELS[lv - 1].minutes), h = 1 + rand(12);
  const type = S.total < 2 ? 'read' : pick(['read', 'read', 'set', 'which']);
  Q = { h, m, type, lv };
  answered = false; hintOn = !!L.hint && false;
  if (type === 'read') Q.opts = shuffle([[h, m], ...distractors(h, m, 2)]);
  if (type === 'which') Q.opts = shuffle([[h, m], ...distractors(h, m, 2)]);
  if (type === 'set') { const sh = pick([2, 3, 4, 8, 9, 10].filter(x => x !== h)); Q.t = sh * 60; }   // hands start apart, so both can be seen and grabbed
  renderPanel();
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function distractors(h, m, n) {
  const key = ([a, b]) => phrase(a, b);
  const want = phrase(h, m), out = [], seen = new Set([want]);
  const add = t => { const k = key(t); if (!seen.has(k)) { seen.add(k); out.push(t); } };
  const ph = h === 1 ? 12 : h - 1;
  const c = [];
  if (m === 0) c.push([nextH(h), 0], [ph, 0], [12, (h * 5) % 60], [h, 30]);
  else if (m % 5 === 0) {
    c.push([ph, m]);                                  // wrong hour (the classic "quarter to" slip)
    if (m !== 30) c.push([h, 60 - m]);               // past and to mixed up
    c.push([nextH(h), m], [m / 5 || 12, (h * 5) % 60], [h, m === 30 ? 0 : 30]);
  } else c.push([h, (m + 5) % 60], [ph, m], [h, 60 - m || 30], [nextH(h), m]);
  for (const t of shuffle(c)) { if (out.length >= n) break; add(t); }
  while (out.length < n) add([1 + rand(12), pick(LEVELS[S.level - 1].minutes)]);
  return out;
}

function renderPanel() {
  if (mode === 'wardrobe') return renderWardrobe();
  const L = LEVELS[S.level - 1];
  let html = `<div class="levels">${LEVELS.map((l, i) => `<button class="lv ${i + 1 === S.level ? 'on' : ''} ${i + 1 > S.unlocked ? 'locked' : ''}" data-lv="${i + 1}">${i + 1 > S.unlocked ? '🔒 ' : ''}${l.name}</button>`).join('')}</div>`;
  const hint = hintOn;
  if (Q.type === 'read') {
    html += `<div class="q">What time does the clock say?</div><div class="clockwrap">${clockSVG(Q.h, Q.m, { hint })}</div>
      <div class="opts">${Q.opts.map(([a, b], i) => `<button class="opt" data-i="${i}">${phrase(a, b)}<small>${digital(a, b)}</small></button>`).join('')}</div>`;
  } else if (Q.type === 'which') {
    html += `<div class="q">Which clock says <b>${phrase(Q.h, Q.m)}</b>?</div>
      <div class="three">${Q.opts.map(([a, b], i) => `<button data-i="${i}">${clockSVG(a, b, { hint, cls: 'clock small' })}</button>`).join('')}</div>`;
  } else {
    const [hh, mm] = fromT(Q.t);
    html += `<div class="q">Move the hands to show <b>${phrase(Q.h, Q.m)}</b></div>
      <div class="clockwrap">${clockSVG(hh, mm, { hint, id: 'setClock' })}</div>
      <div style="text-align:center;font-size:16px;color:#7a5aa6">Drag the <b style="color:#ff4f9a">short pink hand</b> to the hour and the <b style="color:#3d7bff">long blue hand</b> to the minutes.</div>
      <div class="digital" id="setDigital" style="visibility:${hint ? 'visible' : 'hidden'}">${digital(hh, mm)}</div>
      <div class="row"><button class="big purple" id="checkBtn">Check ✓</button></div>`;
  }
  html += `<div id="feedback"></div><div class="row"><button class="soft" id="hintBtn">💡 ${hint ? 'Hide help' : 'Help'}</button><button class="soft" id="learnBtn">📖 How it works</button></div>`;
  $('#panel').innerHTML = html;
  if (Q.type === 'set') bindSetClock();
}
const fromT = t => { const hh = Math.floor(t / 60) % 12 || 12; return [hh, t % 60]; };

// dragging the hands on the "set the clock" question
function bindSetClock() {
  const svg = $('#setClock');
  let hand = null;
  const angleOf = e => {
    const r = svg.getBoundingClientRect();
    const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
    return { a: (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360, d: Math.hypot(x, y) / (r.width / 2) };
  };
  const diff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  const redraw = () => {
    const [hh, mm] = fromT(Q.t);
    const pt = (a, r) => [Math.sin(a * Math.PI / 180) * r, -Math.cos(a * Math.PI / 180) * r];
    const [hx, hy] = pt(((hh % 12) + mm / 60) * 30, 50), [mx, my] = pt(mm * 6, 80);
    svg.querySelector('.hh').setAttribute('x2', hx); svg.querySelector('.hh').setAttribute('y2', hy);
    svg.querySelector('.mh').setAttribute('x2', mx); svg.querySelector('.mh').setAttribute('y2', my);
    $('#setDigital').textContent = digital(hh, mm);
  };
  const move = e => {
    if (!hand || answered) return;
    const { a } = angleOf(e);
    const snap = LEVELS[S.level - 1].snap;
    if (hand === 'm') {
      const target = Math.round(a / 6 / snap) * snap % 60;
      let delta = target - (Q.t % 60);
      if (delta > 30) delta -= 60; if (delta < -30) delta += 60;
      if (delta) { Q.t = (Q.t + delta + 720) % 720; sfx.tick(); }
    } else {
      const hr = Math.floor(((a + 360) % 360) / 30) % 12;
      const nt = hr * 60 + (Q.t % 60);
      if (nt !== Q.t) { Q.t = nt; sfx.tick(); }
    }
    redraw();
  };
  svg.addEventListener('pointerdown', e => {
    if (answered) return;
    svg.setPointerCapture(e.pointerId);
    const { a, d } = angleOf(e);
    const [hh, mm] = fromT(Q.t);
    const dm = diff(a, mm * 6), dh = diff(a, ((hh % 12) + mm / 60) * 30);
    hand = (d < 0.55 && dh < 50) || dh + 15 < dm ? 'h' : 'm';
    move(e);
  });
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerup', () => { hand = null; });
  $('#checkBtn').addEventListener('click', () => {
    if (answered) return;
    const [hh, mm] = fromT(Q.t);
    answer(hh === Q.h && mm === Q.m, $('#checkBtn'));
  });
}

async function answer(ok, el) {
  answered = true;
  const fb = $('#feedback');
  if (ok) {
    S.total++; S.streak++;
    const bonus = S.streak % 5 === 0 ? 1 : 0;
    S.stars += 1 + bonus;
    S.right[S.level] = (S.right[S.level] || 0) + (Q.lv === S.level ? 1 : 0);
    save(); sfx.good(); flyStar(el); renderDoll('happy'); confetti(bonus ? 70 : 30);
    const ci = rand(CHEERS.length), cheer = CHEERS[ci];
    fb.innerHTML = `<div class="explain good">${cheer} It's <b>${phrase(Q.h, Q.m)}</b> (${digital(Q.h, Q.m)}).${bonus ? ' 🎉 Five in a row: a bonus star!' : ''}</div>`;
    const tk = timeKey(Q.h, Q.m);   // every-minute times have no recording: the iPad voice says those
    voice(tk ? [`cheer-${ci}`, tk, ...(bonus ? ['bonus'] : [])] : [], `${cheer} ${phrase(Q.h, Q.m)}`);
    renderTop();
    await sleep(1700);
    const L = LEVELS[S.level - 1];
    if (S.level === S.unlocked && S.level < 5 && (S.right[S.level] || 0) >= L.need) {
      S.unlocked++; S.level = S.unlocked; save(); sfx.level(); confetti(90); voice(['level'], '');
      toast(`🎉 New level: <b>${LEVELS[S.level - 1].name}</b>!`);
      showLesson(S.level);
    }
    newQuestion(); renderTop();
  } else {
    S.streak = 0; save(); sfx.bad(); renderDoll('sad');
    fb.innerHTML = `<div class="explain">${explain(Q.h, Q.m)}</div><div class="row"><button class="big" id="nextBtn">Next clock ➜</button></div>`;
    if (CLIPS.has('nq') && timeKey(Q.h, Q.m) && CLIPS.has(timeKey(Q.h, Q.m))) voice(['nq', timeKey(Q.h, Q.m)], ''); else say(`Not quite. ${explain(Q.h, Q.m)}`);
    if (Q.type === 'set') {         // show the right answer on the clock
      Q.t = (Q.h % 12) * 60 + Q.m; const svg = $('#setClock');
      svg.outerHTML = clockSVG(Q.h, Q.m, { hint: hintOn, id: 'setClock' });
      $('#setDigital').style.visibility = 'visible'; $('#setDigital').textContent = digital(Q.h, Q.m);
    }
    $('#nextBtn').addEventListener('click', () => newQuestion());
  }
}

// ---------- lesson cards with a moving clock ----------
let lessonAnim = 0;
function showLesson(n) {
  const L = LEVELS[n - 1];
  S.seen[n] = true; save();
  $('#lessonCard').innerHTML = `<h2>Level ${n}: ${L.name}</h2>
    <div class="legend"><span style="--c:#ff4f9a">short = hour</span><span style="--c:#3d7bff">long = minutes</span></div>
    <div id="demoClock"></div><div class="digital" id="demoDigital"></div>
    ${L.text.map(t => `<p>${t}</p>`).join('')}
    <div class="row"><button class="soft" id="replayBtn">↺ Watch again</button><button class="big" id="gotBtn">Got it!</button></div>`;
  $('#lessonOv').classList.add('show');
  const play = () => {
    const [[h0, m0], [h1, m1]] = L.demo;
    const t0 = h0 * 60 + m0, t1 = h1 * 60 + m1, start = performance.now(), dur = 2600;
    const id = ++lessonAnim;
    const step = now => {
      if (id !== lessonAnim) return;
      const p = Math.min(1, (now - start) / dur), t = Math.round(t0 + (t1 - t0) * (p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2));
      const [hh, mm] = fromT(t);
      $('#demoClock').innerHTML = clockSVG(hh, mm, { hint: n >= 4 });
      $('#demoDigital').textContent = digital(hh, mm);
      if (p < 1) requestAnimationFrame(step); else voice([`lesson-${n}`], L.text.join(' '));
    };
    requestAnimationFrame(step);
  };
  play();
  $('#replayBtn').onclick = () => { sfx.tick(); play(); };
  $('#gotBtn').onclick = () => { lessonAnim++; speechSynthesis && speechSynthesis.cancel(); $('#lessonOv').classList.remove('show'); };
}

// ---------- wardrobe ----------
let cat = 'dress', confirmId = null;
function renderWardrobe() {
  const items = ITEMS.filter(i => i.cat === cat);
  const worn = id => {
    const c = BY_ID[id].cat;
    if (c === 'makeup') return S.look.makeup.includes(id);
    if (c === 'hairColor') return S.look.hairColor === id;
    if (c === 'skin') return S.look.skin === id;
    if (c === 'hair') return S.look.hair === id;
    if (c === 'eyes') return S.look.eyes === id;
    return S.look[c] === id;
  };
  $('#panel').innerHTML = `<div class="cats">${CATS.map(c => `<button class="cat ${c.key === cat ? 'on' : ''}" data-cat="${c.key}">${c.icon} ${c.label}</button>`).join('')}</div>
    <div class="items">${items.map(it => {
      const own = S.owned.includes(it.id);
      return `<button class="item ${own ? '' : 'locked'} ${worn(it.id) ? 'on' : ''} ${confirmId === it.id ? 'confirm' : ''}" data-item="${it.id}">
        ${own ? '' : `<span class="price">⭐ ${it.cost}</span>`}${thumbSVG(it, S.look)}<div class="nm">${confirmId === it.id ? `Tap again to buy!` : esc(it.name)}</div></button>`;
    }).join('')}</div>`;
}
function wear(it) {
  const L = S.look;
  if (it.cat === 'makeup') {
    if (L.makeup.includes(it.id)) L.makeup = L.makeup.filter(x => x !== it.id);
    else { L.makeup = L.makeup.filter(x => !(it.group && BY_ID[x] && BY_ID[x].group === it.group)); L.makeup.push(it.id); }
  } else if (['top', 'bottom'].includes(it.cat)) { L[it.cat] = it.id; L.dress = null; }
  else if (CATS.find(c => c.key === it.cat).optional && L[it.cat] === it.id) L[it.cat] = null;   // tap again to take it off
  else L[it.cat] = it.id;
  save(); renderDoll(); renderWardrobe();
}
$('#panel').addEventListener('click', e => {
  audio();
  const lv = e.target.closest('[data-lv]');
  if (lv) { const n = +lv.dataset.lv; if (n > S.unlocked) { toast('Finish the level before to open this one!'); return; } S.level = n; save(); renderTop(); if (!S.seen[n]) showLesson(n); newQuestion(); return; }
  const c = e.target.closest('[data-cat]');
  if (c) { sfx.pop(); cat = c.dataset.cat; confirmId = null; renderWardrobe(); return; }
  const itb = e.target.closest('[data-item]');
  if (itb) {
    const it = BY_ID[itb.dataset.item];
    if (S.owned.includes(it.id)) { confirmId = null; sfx.pop(); wear(it); return; }
    if (S.stars < it.cost) { toast(`You need ${it.cost - S.stars} more ⭐. Go and read some clocks!`); sfx.bad(); voice(['need'], ''); return; }
    if (confirmId !== it.id) { confirmId = it.id; renderWardrobe(); return; }
    S.stars -= it.cost; S.owned.push(it.id); confirmId = null; save(); sfx.buy(); confetti(40);
    toast(`✨ You got the ${esc(it.name)}!`); voice([`got-${it.id}`], `You got the ${it.name}!`);
    renderTop(); wear(it); renderDoll('happy');
    return;
  }
  if (answered || !Q) return;
  if (e.target.closest('#hintBtn')) { hintOn = !hintOn; const t = Q.t; renderPanel(); if (Q.type === 'set') Q.t = t; return; }
  if (e.target.closest('#learnBtn')) { showLesson(S.level); return; }
  const o = e.target.closest('[data-i]');
  if (o && (Q.type === 'read' || Q.type === 'which')) {
    sfx.pop();
    const [a, b] = Q.opts[+o.dataset.i];
    const ok = a === Q.h && b === Q.m;
    o.classList.add(ok ? 'good' : 'bad');
    if (!ok) { const right = Q.opts.findIndex(([x, y]) => x === Q.h && y === Q.m); $(`[data-i="${right}"]`).classList.add('good'); }
    answer(ok, o);
  }
});

// ---------- tabs, sound, welcome ----------
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  audio(); mode = t.dataset.mode;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  renderPanel();
}));
$('#soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderTop(); });
$('#musicBtn').addEventListener('click', () => { S.music = !S.music; save(); renderTop(); if (S.music) startMusic(); else stopMusic(); });
$('#goBtn').addEventListener('click', () => {
  audio(); startMusic(); const nm = $('#nameIn').value.trim() || S.name; voice(nm === 'Margot' ? ['hello'] : [], `Hello ${nm}! Let's learn the clock.`);
  S.name = $('#nameIn').value.trim().slice(0, 14) || S.name; S.started = true; save();
  $('#welcome').classList.remove('show'); renderTop();
  if (!S.seen[S.level]) showLesson(S.level);
});
function layout() { document.body.classList.toggle('portrait', innerHeight > innerWidth * 1.05); }
addEventListener('resize', layout);
layout();
renderDoll(); renderTop(); newQuestion();
if (!S.started) { $('#nameIn').value = S.name; $('#welcome').classList.add('show'); }
document.addEventListener('pointerdown', () => { audio(); startMusic(); }, { once: true });
window.__ttb = { get S() { return S; }, get Q() { return Q; } };
</script>
