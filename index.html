<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tick-Tock">
<meta name="theme-color" content="#ffd6ea">
<title>Tick-Tock Boutique</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff5c9a; --pink2: #ffd6ea; --purple: #8a5cf6; --ink: #3b2450; --soft: #fff7fb;
    --hour: #ff4f9a; --minute: #3d7bff; --good: #2fbf71; --bad: #ff7a59;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    font-family: "Fredoka", "Avenir Next", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(160deg, #ffe3f1 0%, #f2e6ff 55%, #dff3ff 100%);
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex: none; }
  .brand { font-weight: 700; font-size: 22px; color: var(--pink); letter-spacing: .5px; flex: 1; white-space: nowrap; }
  .brand small { color: var(--purple); font-weight: 500; font-size: 15px; margin-left: 6px; }
  .stars { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 20px; box-shadow: 0 3px 0 #f0c6dd; }
  .tabs { display: flex; gap: 6px; }
  .tab { padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.6); font-weight: 600; font-size: 16px; }
  .tab.on { background: var(--pink); color: #fff; box-shadow: 0 3px 0 #d63d7a; }
  .icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.7); font-size: 18px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 38%) 1fr; gap: 14px; padding: 0 16px 14px; }
  body.portrait main { grid-template-columns: 1fr; grid-template-rows: 36% 1fr; }
  #stage { position: relative; background: #fff; border-radius: 24px; box-shadow: 0 6px 0 #f0c6dd, 0 14px 30px rgba(138,92,246,.15); overflow: hidden; display: flex; flex-direction: column; }
  #doll { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
  #doll { position: relative; }
  #doll .bgsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pdoll { position: relative; height: 100%; max-width: 100%; aspect-ratio: 723 / 800; animation: sway 4s ease-in-out infinite; transform-origin: 50% 90%; }
  .pdoll img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .pdoll img.pet { transform: scale(.8); transform-origin: 100% 96%; }   /* pets come at full size: smaller, at her feet */
  .colours { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 4px; }
  .colours button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 0 #e7d6f7, 0 0 0 2px #f0d2e6; }
  .colours button.on { box-shadow: 0 0 0 3px var(--pink); transform: scale(1.12); }
  .item img.th { width: 100%; height: 92px; object-fit: contain; display: block; }
  .item.locked img.th { filter: grayscale(1) opacity(.45); }
  .grouplabel { grid-column: 1 / -1; font-weight: 700; color: var(--purple); margin-top: 6px; }
  @keyframes sway { 0%,100% { transform: rotate(-1deg) } 50% { transform: rotate(1deg) translateY(-1%) } }
  .twinkle { position: absolute; pointer-events: none; font-size: 18px; opacity: 0; animation: twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.4) } 50% { opacity: .9; transform: scale(1) rotate(30deg) } }
  #doll.happy .pdoll { animation: hop .8s ease; }
  #doll.sad .pdoll { animation: tilt .8s ease; }
  @keyframes hop { 0%,100% { transform: translateY(0) } 30% { transform: translateY(-6%) rotate(-3deg) } 60% { transform: translateY(0) rotate(3deg) } }
  @keyframes tilt { 0%,100% { transform: rotate(0) } 40% { transform: rotate(-4deg) } }
  #levelBar { padding: 8px 14px 12px; font-size: 15px; }
  .bar { height: 12px; border-radius: 6px; background: #f3e3ee; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8fc0, var(--purple)); border-radius: 6px; transition: width .5s; }

  #panel { position: relative; background: rgba(255,255,255,.85); border-radius: 24px; box-shadow: 0 6px 0 #e7d6f7; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }
  .q { font-size: 26px; font-weight: 600; text-align: center; margin: 4px 0 10px; }
  .q b { color: var(--pink); }
  .clockwrap { display: flex; justify-content: center; }
  .clock { width: min(100%, 360px); aspect-ratio: 1; touch-action: none; }
  .clock.small { width: 100%; }
  .opts { display: grid; gap: 10px; margin-top: 12px; }
  .opt { background: #fff; border: 3px solid #f0d2e6; border-radius: 18px; padding: 12px; font-size: 22px; font-weight: 600; box-shadow: 0 4px 0 #f0d2e6; }
  .opt small { display: block; color: #9a86ad; font-size: 15px; font-weight: 500; }
  .opt.good { border-color: var(--good); background: #e8fbef; box-shadow: 0 4px 0 #a6e8c2; }
  .opt.bad { border-color: var(--bad); background: #fff0eb; box-shadow: 0 4px 0 #ffc7b6; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .three button { background: #fff; border: 3px solid #f0d2e6; border-radius: 18px; padding: 6px; box-shadow: 0 4px 0 #f0d2e6; }
  .three button.good { border-color: var(--good); background: #e8fbef; }
  .three button.bad { border-color: var(--bad); background: #fff0eb; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .big { background: linear-gradient(180deg, #ff86b7, var(--pink)); color: #fff; font-weight: 700; font-size: 22px; padding: 12px 28px; border-radius: 999px; box-shadow: 0 5px 0 #d63d7a; }
  .big.purple { background: linear-gradient(180deg, #a989ff, var(--purple)); box-shadow: 0 5px 0 #6a3fd6; }
  .soft { background: #fff; font-weight: 600; font-size: 17px; padding: 9px 18px; border-radius: 999px; box-shadow: 0 3px 0 #e7d6f7; }
  .big:active, .soft:active, .opt:active { transform: translateY(3px); box-shadow: none; }
  .explain { margin-top: 12px; background: #fff4e0; border-radius: 16px; padding: 12px 14px; font-size: 18px; line-height: 1.4; }
  .explain.good { background: #e8fbef; }
  .explain b { color: var(--hour); } .explain i { color: var(--minute); font-style: normal; font-weight: 600; }
  .digital { text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 2px; color: var(--purple); margin-top: 6px; }

  .levels { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .lv { padding: 6px 12px; border-radius: 999px; background: #f3e9ff; font-size: 14px; font-weight: 600; color: #7a5aa6; }
  .lv.on { background: var(--purple); color: #fff; }
  .lv.locked { opacity: .45; }

  /* wardrobe */
  .cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; flex: none; }
  .cat { flex: none; padding: 8px 12px; border-radius: 14px; background: #fff; font-weight: 600; font-size: 15px; box-shadow: 0 3px 0 #f0d2e6; }
  .cat.on { background: var(--pink); color: #fff; box-shadow: 0 3px 0 #d63d7a; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; margin-top: 6px; }
  .item { position: relative; background: #fff; border-radius: 18px; padding: 6px 6px 8px; border: 3px solid transparent; box-shadow: 0 4px 0 #f0d2e6; text-align: center; }
  .item svg { width: 100%; height: 92px; display: block; }
  .item .nm { font-size: 14px; font-weight: 600; line-height: 1.1; }
  .item.on { border-color: var(--pink); }
  .item.locked svg { filter: grayscale(1) opacity(.45); }
  .item .price { position: absolute; top: 6px; right: 6px; background: #ffe14d; border-radius: 999px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
  .item.confirm { border-color: #ffb100; animation: wiggle .4s; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) } 30% { transform: rotate(-3deg) } 60% { transform: rotate(3deg) } }

  /* overlays */
  .overlay { position: fixed; inset: 0; z-index: 30; background: rgba(59,36,80,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .pweek { display: flex; gap: 6px; justify-content: center; align-items: flex-end; height: 110px; margin: 10px 0 2px; }
  .pbar { width: 34px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
  .pfill { width: 100%; background: linear-gradient(#ff9ccf, #b57cff); border-radius: 8px 8px 3px 3px; min-height: 3px; }
  .pbar small { position: absolute; top: -2px; font-size: 12px; color: #7a5a92; } .pbar span { font-size: 12px; color: #9a86ad; margin-top: 3px; }
  .pnote { font-size: 13px; color: #9a86ad; } .rc-line { font-size: 19px; }
  .big.ghost { background: #fff; color: #b0458a; box-shadow: 0 4px 0 #f0c6dd; border: 2px solid #f6b6d8; }
  .card { background: #fff; border-radius: 28px; padding: 22px; width: min(520px, 100%); max-height: 100%; overflow-y: auto; text-align: center; box-shadow: 0 10px 0 #f0c6dd; }
  .card h2 { color: var(--pink); font-size: 28px; margin-bottom: 6px; }
  .card p { font-size: 19px; line-height: 1.45; margin: 8px 0; }
  .card .clock { width: min(70vw, 260px); }
  .card input { font: inherit; font-size: 24px; text-align: center; padding: 8px 14px; border-radius: 14px; border: 3px solid #f0d2e6; width: 80%; user-select: text; -webkit-user-select: text; }
  .legend { display: flex; justify-content: center; gap: 16px; font-weight: 600; margin: 6px 0; }
  .legend span::before { content: ""; display: inline-block; width: 22px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; background: var(--c); }

  #toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 40px); opacity: 0; transition: .3s; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 18px; z-index: 40; pointer-events: none; max-width: 92vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 50; pointer-events: none; border-radius: 3px; }
  .flystar { position: fixed; z-index: 50; font-size: 34px; pointer-events: none; transition: all .8s cubic-bezier(.5,-0.3,.6,1); }

  /* ---------- dusk: a softer, darker look (the clock faces stay light, so they are easy to read) ---------- */
  body { background: radial-gradient(ellipse at 30% 0%, #3b2a5c 0%, #2a1f45 45%, #1a1530 100%); color: #f4ecfb; }
  .brand small { color: #c9b6ff; }
  .stars { background: #3a2c58; color: #fff; box-shadow: 0 3px 0 #17112b; }
  .tab { background: rgba(255,255,255,.1); color: #efe6fb; }
  .icon { background: rgba(255,255,255,.12); color: #fff; }
  #stage { background: #33274f; box-shadow: 0 6px 0 #17112b, 0 14px 30px rgba(0,0,0,.35); }
  #panel { background: #2f2449; box-shadow: 0 6px 0 #17112b; color: #f4ecfb; }
  .bar { background: #46385f; }
  .opt { background: #3f3160; color: #fff; border-color: #584682; box-shadow: 0 4px 0 #1f1736; }
  .opt small { color: #c3b2dd; }
  .opt.good { background: #1d4a36; border-color: var(--good); box-shadow: 0 4px 0 #12301f; }
  .opt.bad { background: #4c2a30; border-color: var(--bad); box-shadow: 0 4px 0 #2e171b; }
  .three button { background: #3f3160; border-color: #584682; box-shadow: 0 4px 0 #1f1736; }
  .three button.good { background: #1d4a36; } .three button.bad { background: #4c2a30; }
  .soft { background: #3f3160; color: #fff; box-shadow: 0 3px 0 #1f1736; }
  .explain { background: #3d2f58; color: #f6eefc; } .explain.good { background: #1d4a36; }
  .explain i { color: #8fb2ff; }
  .digital { color: #c9b6ff; }
  .lv { background: #3f3160; color: #d9c9f5; } .lv.on { background: var(--purple); color: #fff; }
  .cat { background: #3f3160; color: #fff; box-shadow: 0 3px 0 #1f1736; }
  .item { background: #3a2d58; color: #fff; box-shadow: 0 4px 0 #1f1736; }
  .grouplabel { color: #c9b6ff; }
  .colours button { border-color: #2f2449; box-shadow: 0 0 0 2px #584682; }
  .overlay { background: rgba(10,6,24,.6); }
  .card { background: #2f2449; color: #f4ecfb; box-shadow: 0 10px 0 #17112b; }
  .card input, #nameIn { background: #fff; color: #3b2450; }
  .big.ghost { background: #3f3160; color: #ffb6d8; border-color: #584682; box-shadow: 0 4px 0 #1f1736; }
  .pnote, .pbar small, .pbar span { color: #b9a6d6; }
  #toast { background: #120d24; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Tick-Tock Boutique <small id="who"></small></div>
    <div class="tabs">
      <button class="tab on" data-mode="clock">⏰ Clocks</button>
      <button class="tab" data-mode="wardrobe">👗 Wardrobe</button>
    </div>
    <div class="stars" id="tally" title="Levels finished">🏆 0/10</div>
    <div class="stars" id="stars">⭐ 0</div>
    <button class="icon" id="progressBtn" title="My progress">🌟</button>
    <button class="icon" id="exitBtn" title="Save and exit">💾</button>
    <button class="icon" id="musicBtn" title="Music">🎵</button>
    <button class="icon" id="soundBtn" title="Sound">🔊</button>
  </header>
  <main>
    <section id="stage">
      <div id="doll"></div>
      <div id="levelBar"></div>
    </section>
    <section id="panel"></section>
  </main>
</div>

<div class="overlay" id="welcome"><div class="card">
  <h2>Tick-Tock Boutique</h2>
  <p>Read the clocks to earn ⭐ stars.<br>Spend your stars on dresses, crowns, make-up and more!</p>
  <p><input id="nameIn" maxlength="14" placeholder="Your name"></p>
  <div class="row"><button class="big" id="goBtn">Let's play!</button></div>
</div></div>

<div class="overlay" id="byeOv"><div class="card">
  <h2>All saved! 💾</h2>
  <p id="byeText"></p>
  <div class="row"><button class="big" id="byeBtn">Keep playing</button></div>
</div></div>
<div class="overlay" id="progOv"><div class="card" id="progCard"></div></div>
<div class="overlay" id="lessonOv"><div class="card" id="lessonCard"></div></div>
<div id="toast"></div>

<script type="module">
import { ITEMS, BY_ID } from './doll.js';
import { loadPrincess, princessHTML, SHOP, OPTIONAL, PCATS, DEFAULT_LOOK, FREE_ITEMS, itemName, itemCost, thumbURL, swatches } from './princess.js';
await loadPrincess();

const $ = s => document.querySelector(s);
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- saved progress (this iPad only) ----------
const KEY = 'ttb:v1';
const FREE = ITEMS.filter(i => i.cost === 0).map(i => i.id);
const DEFAULT = {
  name: new URLSearchParams(location.search).get('name') || 'Margot',
  stars: 3, owned: FREE, music: true, unlocked: 1, level: 1, right: {}, seen: {}, sound: true, streak: 0, total: 0,
  look: { bg: 'bedroom', skin: 'sk1', eyes: 'ey-brown', hair: 'long', hairColor: 'hc-brown', top: 'tee', bottom: 'shorts', dress: null, shoes: 'trainers', hat: null, wings: null, acc: null, makeup: [] },
};
let S = DEFAULT;
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) S = { ...DEFAULT, ...v, look: { ...DEFAULT.look, ...(v.look || {}) } }; } catch (e) {}
// ---------- the cloud copy: iPad Safari can forget a website's data, so progress is also kept in Firebase ----------
const CLOUD = 'https://wizard-chess-manon-default-rtdb.europe-west1.firebasedatabase.app/ttb/';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const urlCode = (new URLSearchParams(location.search).get('p') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
if (urlCode) {
  try {   // her personal link: if the cloud copy is newer (or this iPad forgot her), use it
    const r = await fetch(CLOUD + urlCode + '.json', { cache: 'no-store' });
    const c = r.ok ? await r.json() : null;
    if (c && c.name && ((c.t || 0) > (S.t || 0) || !S.started)) S = { ...DEFAULT, ...c, look: { ...DEFAULT.look, ...(c.look || {}) } };
  } catch (e) {}
  S.code = urlCode;
}
// Firebase drops empty records and turns {1: x, 2: y} into lists, so put the shapes back after loading
const asObj = v => (Array.isArray(v) ? Object.fromEntries(v.map((x, i) => [i, x]).filter(([, x]) => x != null)) : (v && typeof v === 'object' ? v : {}));
for (const o of [S, S.en, S.nl].filter(Boolean)) { o.right = asObj(o.right); o.seen = asObj(o.seen); }
S.prizes = Array.isArray(S.prizes) ? S.prizes : []; S.owned = Array.isArray(S.owned) ? S.owned : [];
if (S.p) S.p = asObj(S.p);
S.code = S.code || Array.from(crypto.getRandomValues(new Uint8Array(6)), b => CODE_CHARS[b % CODE_CHARS.length]).join('');
let cloudTimer = null, cloudDirty = false;
function cloudSave() {
  try { savePointer(); } catch (e) {}
  clearTimeout(cloudTimer); cloudTimer = null; cloudDirty = false;
  try { fetch(CLOUD + S.code + '.json', { method: 'PUT', body: JSON.stringify(S), keepalive: true }).catch(() => { cloudDirty = true; }); } catch (e) { cloudDirty = true; }
}
function cloudSoon() { cloudDirty = true; if (!cloudTimer) cloudTimer = setTimeout(cloudSave, 2500); }
setInterval(() => { if (cloudDirty) cloudSave(); }, 30000);                     // and every 30 seconds in any case
addEventListener('pagehide', cloudSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) cloudSave(); });
S.owned = [...new Set([...S.owned, ...FREE])];
if (!S.p) {
  // moving from the drawn doll to the princess: every star she spent on old clothes comes back
  const spent = S.owned.filter(id => BY_ID[id] && BY_ID[id].cost > 0 && BY_ID[id].cat !== 'bg').reduce((t, id) => t + BY_ID[id].cost, 0);
  S.stars += spent; S.refund = spent;
  S.p = { ...DEFAULT_LOOK }; S.pown = [...FREE_ITEMS];
}
S.pown = [...new Set([...(S.pown || []), ...FREE_ITEMS])];
S.look.bg = S.look.bg || 'bedroom';
const save = () => { S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} cloudSoon(); };
S.nl = S.nl || { level: 1, right: {}, seen: {} };
S.prizes = S.prizes || [];
// English progress lives in S.level/unlocked/right/seen; in Klokkenland those hold the Dutch progress and S.en keeps the English
const enUnlocked = () => (NL() ? S.en.unlocked : S.unlocked);
const nlOpen = () => Math.min(LEVELS_NL.length, enUnlocked() - 1);   // a Dutch level opens when the same English level is done
function setWorld(w) {
  if (w === (S.world || 'en')) return;
  if (w === 'nl') {
    S.en = { level: S.level, unlocked: S.unlocked, right: S.right, seen: S.seen };
    S.world = 'nl'; LEVELS = LEVELS_NL;
    S.level = Math.min(S.nl.level || 1, nlOpen()); S.unlocked = nlOpen(); S.right = S.nl.right; S.seen = S.nl.seen;
  } else {
    S.nl = { level: S.level, right: S.right, seen: S.seen };
    S.world = 'en'; LEVELS = LEVELS_EN;
    ({ level: S.level, unlocked: S.unlocked, right: S.right, seen: S.seen } = S.en);
  }
  save();
}


// ---------- the levels ----------
const LEVELS_EN = [
  { name: "O'clock", minutes: [0], snap: 5, need: 6,
    text: ["Every clock has two hands.", "The <b>short pink hand</b> is the <b>hour</b> hand. The <i>long blue hand</i> is the <i>minute</i> hand.",
      "When the long hand points straight up at <i>12</i>, it's something <b>o'clock</b>. Look where the short hand points: that's the hour!"],
    demo: [[2, 0], [3, 0]], hold: [3, 0] },
  { name: 'Half past', minutes: [30, 30, 0], snap: 5, need: 6,
    text: ["When the long hand has gone <i>halfway round</i>, down to the <i>6</i>, it's <b>half past</b>.",
      "The short hand is now halfway between two numbers. Say the number it has just gone past.", "This clock says <b>half past 3</b>."],
    demo: [[3, 0], [3, 30]], hold: [3, 30] },
  { name: 'Quarter past & to', minutes: [15, 45, 15, 45, 30], snap: 5, need: 8,
    text: ["A quarter of the way round, at the <i>3</i>, is <b>quarter past</b>.",
      "Three quarters of the way round, at the <i>9</i>, is <b>quarter to</b> the next hour.",
      "At quarter to 4 the short hand is <b>nearly at 4</b>, so we say quarter to 4."],

// dragging the hands on the "set the clock" question
function bindSetClock() {

  const angleOf = e => {
    const r = svg.getBoundingClientRect();

    const [hh, mm] = fromT(Q.t);
    const pt = (a, r) => [Math.sin(a * Math.PI / 180) * r, -Math.cos(a * Math.PI / 180) * r];
    const [hx, hy] = pt(((hh % 12) + mm / 60) * 30, 50), [mx, my] = pt(mm * 6, 80);
    svg.querySelector('.hh').setAttribute('x2', hx); svg.querySelector('.hh').setAttribute('y2', hy);
    svg.querySelector('.mh').setAttribute('x2', mx); svg.querySelector('.mh').setAttribute('y2', my);
    $('#setDigital').textContent = digital(hh, mm);
  };
  const move = e => {
    if (!hand || answered) return;
    const { a } = angleOf(e);
    const snap = LEVELS[S.level - 1].snap;
    if (hand === 'm') {
      const target = Math.round(a / 6 / snap) * snap % 60;
      let delta = target - (Q.t % 60);
      if (delta > 30) delta -= 60; if (delta < -30) delta += 60;
      if (delta) { Q.t = (Q.t + delta + 720) % 720; sfx.tick(); }
    } else {
      const hr = Math.floor(((a + 360) % 360) / 30) % 12;

    }
    redraw();
  };
  svg.addEventListener('pointerdown', e => {
    if (answered) return;
    svg.setPointerCapture(e.pointerId);
    const { a, d } = angleOf(e);
    const [hh, mm] = fromT(Q.t);

    const step = now => {
      if (id !== lessonAnim) return;
      const p = Math.min(1, (now - start) / dur), t = Math.round(t0 + (t1 - t0) * (p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2));
      const [hh, mm] = fromT(t);
      $('#demoClock').innerHTML = clockSVG(hh, mm, { hint: n >= 4 });
      $('#demoDigital').textContent = digital(hh, mm);
      if (p < 1) requestAnimationFrame(step); else voice([VK(`lesson-${n}`)], L.text.join(' '));
    };
    requestAnimationFrame(step);
  };
  play();
  $('#replayBtn').onclick = () => { sfx.tick(); play(); };
  $('#gotBtn').onclick = () => { renderTop(); if (stepOf(S.level) === 2 && Q && !answered) { hintOn = true; renderPanel(); } lessonAnim++; speechSynthesis && speechSynthesis.cancel(); $('#lessonOv').classList.remove('show'); };
}

// ---------- wardrobe ----------
let cat = 'gown', confirmId = null, focus = null;   // focus: the part whose colours are showing
function renderWardrobe() {
  const C = PCATS.find(c => c.key === cat);
  let grid = '';
  if (cat === 'bg') {
    grid = ITEMS.filter(i => i.cat === 'bg').map(it => {
      const own = S.owned.includes(it.id);
      return `<button class="item ${own ? '' : 'locked'} ${S.look.bg === it.id ? 'on' : ''} ${confirmId === 'bg:' + it.id ? 'confirm' : ''}" data-bg="${it.id}">
        ${own ? '' : `<span class="price">⭐ ${it.cost}</span>`}<svg viewBox="0 0 300 500" style="width:100%;height:92px" preserveAspectRatio="xMidYMid slice">${it.draw()}</svg>
        <div class="nm">${confirmId === 'bg:' + it.id ? 'Tap again to buy!' : esc(it.name)}</div></button>`;
    }).join('');
  } else {
    for (const part of C.parts) {
      if (C.parts.length > 1) grid += `<div class="grouplabel">${{ hat: 'Crowns', veil: 'Veils', necklace: 'Necklaces', earrings: 'Earrings', bracelets: 'Bracelets', gloves: 'Gloves', girdle: 'Belts', in_hand_left: 'Low hand', in_hand_right: 'High hand', eyes: 'Eyes', irises: 'Eye colour', eyebrows: 'Eyebrows', lips: 'Lips', cheeks: 'Blush' }[part]}</div>`;
      grid += SHOP[part].map(([style, name, cost]) => {
        const id = `${part}-${style}`, own = S.pown.includes(id), worn = S.p[part] && S.p[part][0] === style, prize = PRIZES[id];
        return `<button class="item ${own ? '' : 'locked'} ${worn ? 'on' : ''} ${confirmId === id ? 'confirm' : ''}" data-part="${part}" data-style="${style}">
          ${own ? '' : prize ? `<span class="price">🎁 ${prize}</span>` : `<span class="price">⭐ ${cost}</span>`}<img class="th" src="${thumbURL(part, style)}" alt="">
          <div class="nm">${confirmId === id ? 'Tap again to buy!' : esc(name)}</div></button>`;
      }).join('');
    }
  }
  // colour choices for the thing she just picked (free once she owns it)
  let colours = '';
  const fp = focus && C.parts.includes(focus) ? focus : C.parts.find(p => S.p[p]);
  if (fp && S.p[fp]) {
    const sw = swatches(fp, S.p[fp][0]);
    if (sw.length > 1) colours = `<div class="grouplabel" style="text-align:center">🎨 Pick a colour for your ${esc(itemName(fp, S.p[fp][0]).toLowerCase())}</div><div class="colours">${sw.map((c, i) => `<button class="${S.p[fp][1] === i + 1 ? 'on' : ''}" style="background:${c}" data-colour="${i + 1}" data-cpart="${fp}" aria-label="colour ${i + 1}"></button>`).join('')}</div>`;
  }
  $('#panel').innerHTML = `<div class="cats">${PCATS.map(c => `<button class="cat ${c.key === cat ? 'on' : ''}" data-cat="${c.key}">${c.icon} ${c.label}</button>`).join('')}</div>${colours}<div class="items">${grid}</div>`;
}
function wearPart(part, style) {
  const cur = S.p[part];
  if (cur && cur[0] === style && OPTIONAL.has(part)) S.p[part] = null;            // tap again to take it off
  else S.p[part] = [style, cur ? cur[1] : Math.ceil((swatches(part, style).length || 1) / 2)];
  focus = part;
  save(); sfx.wear(); renderDoll(); renderWardrobe();
}
$('#panel').addEventListener('click', e => {
  audio();
  const lv = e.target.closest('[data-lv]');
  const wb = e.target.closest('[data-world]');
  if (wb) {
    const w = wb.dataset.world;
    if (w === 'nl' && nlOpen() < 1) { toast("Finish level 1 (O'clock) to open Klokkenland! 🇧🇪"); return; }
    setWorld(w); sfx.pop(); renderTop();
    if (w === 'nl' && !S.seen.nlhello) { S.seen.nlhello = true; save(); voice(['nl-hello'], 'Welkom in Klokkenland!'); toast('🇧🇪 Welkom in Klokkenland! Hier krijg je dubbele sterren.'); }
    if (!S.seen[S.level]) showLesson(S.level);
    newQuestion(); return;
  }
  if (lv) { const n = +lv.dataset.lv; if (n > S.unlocked) { toast('Finish the level before to open this one!'); return; } S.level = n; save(); renderTop(); if (!S.seen[n]) showLesson(n); newQuestion(); return; }
  const c = e.target.closest('[data-cat]');
  if (c) { sfx.pop(); cat = c.dataset.cat; confirmId = null; renderWardrobe(); return; }
  const col = e.target.closest('[data-colour]');
  if (col) { const p = col.dataset.cpart; S.p[p] = [S.p[p][0], +col.dataset.colour]; focus = p; save(); sfx.wear(); renderDoll(); renderWardrobe(); return; }
  const bgb = e.target.closest('[data-bg]');
  if (bgb) {
    const it = BY_ID[bgb.dataset.bg];
    if (S.owned.includes(it.id)) { confirmId = null; S.look.bg = it.id; save(); sfx.wear(); renderDoll(); renderWardrobe(); return; }
    if (S.stars < it.cost) { toast(`You need ${it.cost - S.stars} more ⭐. Go and read some clocks!`); sfx.bad(); voice(['need'], ''); return; }
    if (confirmId !== 'bg:' + it.id) { confirmId = 'bg:' + it.id; renderWardrobe(); return; }
    S.stars -= it.cost; S.owned.push(it.id); S.look.bg = it.id; confirmId = null; save(); sfx.buy(); confetti(40);
    toast(`✨ You got the ${esc(it.name)}!`); voice([`got-${it.id}`], `You got the ${it.name}!`);
    renderTop(); renderDoll('happy'); renderWardrobe();
    return;
  }
  const itb = e.target.closest('[data-part]');
  if (itb) {
    const part = itb.dataset.part, style = +itb.dataset.style, id = `${part}-${style}`, cost = itemCost(part, style), name = itemName(part, style);
    if (S.pown.includes(id)) { confirmId = null; sfx.pop(); wearPart(part, style); return; }
    if (PRIZES[id]) { toast(`🎁 This is a prize! Finish <b>${PRIZES[id]}</b> to win it.`); sfx.bad(); return; }
    if (S.stars < cost) { toast(`You need ${cost - S.stars} more ⭐. Go and read some clocks!`); sfx.bad(); voice(['need'], ''); return; }
    if (confirmId !== id) { confirmId = id; renderWardrobe(); return; }
    S.stars -= cost; S.pown.push(id); confirmId = null; save(); sfx.buy(); confetti(40);
    toast(`✨ You got the ${esc(name)}!`); voice([`got-p-${id}`], `You got the ${name}!`);
    renderTop(); wearPart(part, style); renderDoll('happy');
    return;
  }
  if (answered || !Q) return;
  if (e.target.closest('#hintBtn')) { hintOn = !hintOn; const t = Q.t; renderPanel(); if (Q.type === 'set') Q.t = t; return; }
  if (e.target.closest('#learnBtn')) { showLesson(S.level); return; }
  const o24 = e.target.closest('[data-i24]');
  if (o24 && Q.opts24) {
    sfx.pop();
    const ok = Q.opts24[+o24.dataset.i24] === Q.h24;
    o24.classList.add(ok ? 'good' : 'bad');
    if (!ok) $(`[data-i24="${Q.opts24.indexOf(Q.h24)}"]`).classList.add('good');
    answer(ok, o24); return;
  }
  const o = e.target.closest('[data-i]');
  if (o && (Q.type === 'read' || Q.type === 'which')) {
    sfx.pop();
    const [a, b] = Q.opts[+o.dataset.i];
    const ok = a === Q.h && b === Q.m;
    o.classList.add(ok ? 'good' : 'bad');
    if (!ok) { const right = Q.opts.findIndex(([x, y]) => x === Q.h && y === Q.m); $(`[data-i="${right}"]`).classList.add('good'); }
    answer(ok, o);
  }
});

// ---------- tabs, sound, welcome ----------
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  audio(); mode = t.dataset.mode;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  renderPanel();
}));
$('#exitBtn').addEventListener('click', () => {
  save(); cloudSave(); sfx.ding();
  showProgress('tonight'); voice([...recapClips('tonight'), NL() ? 'nl-bye' : 'bye'], '');
});
$('#byeBtn').addEventListener('click', () => $('#byeOv').classList.remove('show'));
$('#progressBtn').addEventListener('click', () => { audio(); showProgress('now'); voice(recapClips('now'), ''); });
$('#soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderTop(); });
$('#musicBtn').addEventListener('click', () => { S.music = !S.music; save(); renderTop(); if (S.music) startMusic(); else stopMusic(); });
$('#goBtn').addEventListener('click', () => {
  audio(); startMusic(); const nm = $('#nameIn').value.trim() || S.name; voice(nm === 'Margot' ? ['hello'] : [], `Hello ${nm}! Let's learn the clock.`);
  S.name = $('#nameIn').value.trim().slice(0, 14) || S.name; S.started = true; save();
  $('#welcome').classList.remove('show'); renderTop();
  if (!S.seen[S.level]) showLesson(S.level);
});

// ---------- 🌟 progress: every session is remembered, and Jessica gives a kind recap ----------
// S.sess: [{ d: start time, r: right, w: not yet, c: { 'en-3': [r, w] } }], S.skill: { 'en-3': [r, w] } for all time
const catKey = () => `${NL() ? 'nl' : 'en'}-${Q.lv || S.level}`;
const CAT_WORDS = { 'en-1': "o'clock times", 'en-2': 'half past', 'en-3': 'quarter past and quarter to', 'en-4': 'the five-minute times', 'en-5': 'the twenty-four hour clock', 'en-6': 'every-minute times',
  'nl-1': "Dutch o'clock times", 'nl-2': 'Dutch half past', 'nl-3': 'Dutch quarter past and quarter to', 'nl-4': 'the Dutch five-minute times' };
const CAT_LABEL = k => { const [w, n] = k.split('-'); const L = (w === 'nl' ? LEVELS_NL : LEVELS_EN)[n - 1]; return L ? (w === 'nl' ? '🇧🇪 ' : '') + L.name : k; };
function session() {
  S.sess = Array.isArray(S.sess) ? S.sess : Object.values(asObj(S.sess));
  const last = S.sess[S.sess.length - 1];
  if (last && Date.now() - (last.e || last.d) < 2 * 3600e3) return last;      // the same sitting
  const s = { d: Date.now(), e: Date.now(), r: 0, w: 0, c: {} };
  S.sess.push(s); S.sess = S.sess.slice(-60);
  return s;
}
function noteAnswer(ok) {
  const s = session(), k = catKey();
  s.e = Date.now(); s[ok ? 'r' : 'w']++;
  s.c = asObj(s.c); s.c[k] = s.c[k] || [0, 0]; s.c[k][ok ? 0 : 1]++;
  S.skill = asObj(S.skill); S.skill[k] = S.skill[k] || [0, 0]; S.skill[k][ok ? 0 : 1]++;
}
function bestAndPractise() {
  const sk = Object.entries(asObj(S.skill)).filter(([k]) => CAT_WORDS[k]);
  const acc = ([, [r, w]]) => r / Math.max(1, r + w);
  const best = sk.filter(([, [r, w]]) => r >= 3 && acc([0, [r, w]]) >= 0.7).sort((a, b) => b[1][0] - a[1][0])[0];
  const prac = sk.filter(([, [r, w]]) => w >= 2 && r + w >= 4).sort((a, b) => acc(a) - acc(b))[0];
  // before the tracking began: what she has done most is what she's good at, and her current level is next
  let bestK = best ? best[0] : null;
  if (!bestK) { const en = asObj((S.world === 'nl' ? S.en && S.en.right : S.right) || {}); const top = Object.entries(en).sort((a, b) => b[1] - a[1])[0]; if (top && top[1] >= 3) bestK = 'en-' + top[0]; }
  const curK = `${NL() ? 'nl' : 'en'}-${S.level}`;
  const pracK = prac && prac[0] !== bestK ? prac[0] : curK !== bestK ? curK : null;
  return { bestK, pracK };
}
const num = n => n >= 1 && n <= 250 ? `num-${n}` : 'rc-lots';
function recapClips(kind) {
  const all = (S.sess || []).filter(s => s.r + s.w > 0);
  const s = all[all.length - 1];
  const out = [S.name === 'Margot' ? 'rc-welcome-margot' : 'rc-welcome'];
  if (kind !== 'welcome') out.length = 0;
  if (s) {
    out.push(kind === 'tonight' ? (new Date().getHours() >= 17 ? 'rc-tonight' : 'rc-today') : kind === 'now' ? 'rc-now' : 'rc-last', num(s.r + s.w), 'rc-clocks', num(s.r), 'rc-right');
    if (s.w === 0 && s.r >= 3) out.push('rc-allright');
  } else if (S.total) out.push('rc-total', num(S.total), 'rc-correct');
  const lv = finished();
  if (lv) out.push('rc-sofar', num(lv), lv === 1 ? 'rc-level1' : 'rc-levels', num(S.stars), 'rc-stars');
  const { bestK, pracK } = bestAndPractise();
  if (bestK) out.push('rc-best', `cat-${bestK}`);
  if (pracK) out.push('rc-practise', `cat-${pracK}`);
  out.push(kind === 'tonight' ? 'rc-proud-bye' : 'rc-proud');
  return out;
}
function progressHTML(kind) {
  const all = (S.sess || []).filter(s => s.r + s.w > 0);
  const s = all[all.length - 1];
  const { bestK, pracK } = bestAndPractise();
  // the last seven days, as little bars of clocks read
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 6 + i); return d; });
  const per = days.map(d => all.filter(x => x.d >= d.getTime() && x.d < d.getTime() + 864e5).reduce((t, x) => t + x.r + x.w, 0));
  const max = Math.max(5, ...per);
  const bars = days.map((d, i) => `<div class="pbar"><div class="pfill" style="height:${Math.round(per[i] / max * 100)}%"></div><small>${per[i] || ''}</small><span>${d.toLocaleDateString('en-GB', { weekday: 'short' }).slice(0, 2)}</span></div>`).join('');
  const line = s ? `${kind === 'tonight' ? (new Date().getHours() >= 17 ? 'Tonight' : 'Today') : kind === 'now' ? 'This time' : 'Last time'} you read <b>${s.r + s.w} clocks</b> and got <b>${s.r} right</b>${s.w === 0 && s.r >= 3 ? ', every single one! 🎉' : '!'}` : S.total ? `So far you have read <b>${S.total} clocks</b> correctly!` : `Let's read some clocks!`;
  return `<h2>${kind === 'welcome' ? `Welcome back, ${esc(S.name)}! 🌟` : kind === 'tonight' ? 'All saved! 💾' : `🌟 ${esc(S.name)}'s progress`}</h2>
    <p class="rc-line">${line}</p>
    <p>⭐ <b>${S.stars}</b> stars &nbsp;·&nbsp; 🏆 <b>${finished()}</b> of ${TOTAL_LEVELS} levels &nbsp;·&nbsp; ⏰ <b>${S.total}</b> clocks right in all</p>
    ${bestK ? `<p>💪 Really good at: <b>${esc(CAT_LABEL(bestK))}</b></p>` : ''}
    ${pracK ? `<p>🌱 Lovely to practise next: <b>${esc(CAT_LABEL(pracK))}</b></p>` : ''}
    <div class="pweek">${bars}</div><p class="pnote">Clocks read each day this week</p>`;
}
function showProgress(kind) {
  $('#progCard').innerHTML = progressHTML(kind) + `<div class="row"><button class="big" id="progBtn">${kind === 'tonight' ? 'Keep playing' : "Let's play!"}</button><button class="big ghost" id="progSay">🔊 Listen</button></div>` +
    (kind === 'tonight' ? `<p class="pnote">Everything is saved, so you can close the game now. Save code: <b>${S.code}</b></p>` : '');
  $('#progOv').classList.add('show');
  $('#progBtn').onclick = () => { voiceGen++; $('#progOv').classList.remove('show'); };
  $('#progSay').onclick = () => { audio(); voice(recapClips(kind), ''); };
  progKind = kind;
}
let progKind = null, recapSaid = false;
// the welcome recap is spoken on her first tap (iPads only allow sound after a tap)
document.addEventListener('pointerdown', () => {
  if (recapSaid || !$('#progOv').classList.contains('show') || progKind !== 'welcome') return;
  recapSaid = true; setTimeout(() => voice(recapClips('welcome'), ''), 150);
}, true);
// a pointer so Dad (or a new iPad) can always find her save: wcp/TTBKIDS/<name> -> her save code
function savePointer() {
  const k = (S.name || '').toLowerCase().replace(/[^a-z]/g, '');
  if (!k) return;
  try { fetch(CLOUD.replace('/ttb/', '/wcp/TTBKIDS/') + k + '.json', { method: 'PUT', body: JSON.stringify({ code: S.code, t: Date.now(), name: S.name, stars: S.stars, total: S.total }) }).catch(() => {}); } catch (e) {}
}

function layout() { document.body.classList.toggle('portrait', innerHeight > innerWidth * 1.05); }
addEventListener('resize', layout);
layout();
renderDoll(); renderTop(); newQuestion();
for (let i = 0; i < 9; i++) { const t = document.createElement('div'); t.className = 'twinkle'; t.textContent = pick(['✨', '⭐', '💫']); t.style.left = 6 + rand(86) + '%'; t.style.top = 4 + rand(80) + '%'; t.style.animationDelay = (i * 0.4) + 's'; $('#stage').appendChild(t); }
if (!S.started) { $('#nameIn').value = S.name; $('#welcome').classList.add('show'); }
else if ((S.sess || []).some(x => x.r + x.w > 0) || S.total > 0) showProgress('welcome');
if (S.refund) { const n = S.refund; setTimeout(() => toast(`👑 Welcome to the new Princess Boutique! Your ${n} stars from old clothes are back to spend.`), 800); S.refund = 0; save(); }
document.addEventListener('pointerdown', () => { audio(); startMusic(); }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && AC.state !== 'running') AC.resume(); });
cloudSave();   // make sure the cloud has her from the first moment
window.__ttb = { get S() { return S; }, get Q() { return Q; }, answer: ok => answer(ok, document.body), newQuestion: () => newQuestion(), timeClips: (h, m) => timeClips(h, m) };
</script>
